[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intention-sdk"
version = "4.0.0rc3"
description = "Python SDK for Intention chain DEX and vault workflows"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
  "ecdsa>=0.18",
  "httpx[http2]>=0.24",
  "pycryptodome>=3.20",
  "typing-extensions>=4.0",
  "websockets>=13.1,<16",
]

[project.optional-dependencies]
examples = [
  "python-dotenv>=1.0",
]

[tool.setuptools]
packages = [
  "intention_sdk",
  "intention_sdk.api",
  "intention_sdk.bcs",
  "intention_sdk.core",
  "intention_sdk.events",
  "intention_sdk.transactions",
  "intention_sdk.types",
]

[tool.setuptools.package-data]
intention_sdk = ["py.typed"]
